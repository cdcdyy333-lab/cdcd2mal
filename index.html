let state={page:"home",cat:null,selected:null,query:""};
const app=document.getElementById("app");
const searchBox=document.getElementById("searchBox");
const historyStack=[];

function push(page,cat=null,selected=null,query=state.query){
historyStack.push({...state});
state={page,cat,selected,query};
render();
window.scrollTo({top:0,behavior:"smooth"});
}
function goBack(){
if(historyStack.length){state=historyStack.pop();}
else{state={page:"home",cat:null,selected:null,query:""};}
render();
window.scrollTo({top:0,behavior:"smooth"});
}
function setCat(id){push("category",id,null);}
function openProblem(id){push("detail",state.cat,id);}
function doSearch(){const q=searchBox.value.trim();push("search",null,null,q);}
function googleSearch(q){window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank","noopener");}

function catName(id){const c=categories.find(x=>x.id===id);return c?c.name:"อื่น ๆ";}
function searchAll(q){q=q.toLowerCase();return P.filter(p=>[p.title,p.keywords,p.symptoms,p.causes.join(" "),p.steps.join(" "),catName(p.cat)].join(" ").toLowerCase().includes(q));}

function card(p){
return `<div class="card">
<div class="pic" role="img" aria-label="ภาพประกอบ ${p.title}">${p.icon}</div>
<span class="tag">${catName(p.cat)}</span>
<h3>${p.title}</h3>
<p>${p.symptoms}</p>
<button class="btn" data-action="open" data-id="${p.id}">ดูวิธีแก้ไข</button>
</div>`;}

function render(){
document.querySelectorAll(".sidebar button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));

if(state.page==="home"){
app.innerHTML=`
<div class="hero"><h1>ช่วยแก้เน็ต</h1><p>คู่มือแก้ปัญหาการเชื่อมต่ออินเทอร์เน็ตบนคอมพิวเตอร์ สำหรับนักเรียน นักศึกษา และบุคคลทั่วไป</p>
<div class="banner"><div class="icon" role="img" aria-label="ภาพประกอบคอมพิวเตอร์และอินเทอร์เน็ต">💻📡</div><div><b>แก้ปัญหาเบื้องต้นได้ด้วยตัวเอง</b><br>ค้นหาอาการ สาเหตุ และวิธีแก้ไขทีละขั้นตอน</div></div></div>
<h2 class="section-title">ปัญหาที่พบบ่อย</h2>
<div class="grid">${["W01","N01","S01","D01","L01","R01"].map(id=>card(P.find(p=>p.id===id))).join("")}</div>
<h2 class="section-title">หมวดหมู่ปัญหา</h2>
<div class="grid">${categories.map(c=>`<div class="card"><div class="pic">${c.icon}</div><h3>${c.name}</h3><p>คลิกเพื่อดูปัญหาในหมวดนี้</p><button class="btn" data-action="cat" data-id="${c.id}">เข้าชม</button></div>`).join("")}</div>`;
}

else if(state.page==="categories"){
app.innerHTML=`<h2 class="section-title">หมวดหมู่ปัญหา</h2>
<div class="grid">${categories.map(c=>`<div class="card"><div class="pic">${c.icon}</div><h3>${c.name}</h3><p>ปัญหา ${P.filter(x=>x.cat===c.id).length} รายการ</p><button class="btn" data-action="cat" data-id="${c.id}">เข้าชม</button></div>`).join("")}</div>`;
}

else if(state.page==="category"){
const list=P.filter(p=>p.cat===state.cat);
app.innerHTML=`<button class="btn secondary back" data-action="back">← ย้อนกลับ</button>
<h2 class="section-title">${catName(state.cat)}</h2>
<div class="grid">${list.map(card).join("")}</div>`;
}

else if(state.page==="search"){
const r=searchAll(state.query);
app.innerHTML=`<button class="btn secondary back" data-action="back">← ย้อนกลับ</button>
<h2 class="section-title">ผลการค้นหา: “${state.query}”</h2>
${r.length?`<div class="grid">${r.map(card).join("")}</div>`:`<div class="panel empty">ไม่พบข้อมูลที่ตรงกับคำค้นหา<br>ลองใช้คำค้นอื่น เช่น “Wi‑Fi”, “DNS”, “สาย LAN”, “VPN”</div>`}
<button class="btn" data-action="google" data-q="${state.query}">ค้นหาข้อมูลเพิ่มเติมจาก Google</button>
<p class="note">ผลการค้นหาจาก Google เป็นข้อมูลจากแหล่งภายนอก ไม่ใช่ข้อมูลที่จัดเก็บในเว็บไซต์นี้โดยตรง</p>`;
}

else if(state.page==="guide"){
app.innerHTML=`<h2 class="section-title">วิธีแก้ไขเบื้องต้น</h2>
<div class="panel"><ol>
<li>ตรวจว่าอุปกรณ์อื่นใช้อินเทอร์เน็ตได้หรือไม่</li>
<li>ตรวจสาย LAN สัญญาณ Wi‑Fi และไฟสถานะเราเตอร์</li>
<li>ปิด-เปิด Wi‑Fi หรือถอดเสียบสาย LAN ใหม่</li>
<li>รีสตาร์ตคอมพิวเตอร์หรือเราเตอร์เมื่อทำได้อย่างปลอดภัย</li>
<li>รัน Network troubleshooter ของ Windows</li>
<li>ตรวจ IP, DNS, Proxy และ VPN</li>
<li>ใช้คำสั่ง ipconfig, ping, nslookup เพื่อวินิจฉัย</li>
<li>หากยังไม่ได้ ให้ติดต่อผู้ดูแลระบบหรือผู้ให้บริการ</li>
</ol><p class="note">ห้ามรีเซ็ตเราเตอร์เป็นค่าโรงงานหรือปิดระบบป้องกันความปลอดภัยโดยไม่จำเป็น</p></div>`;
}

else if(state.page==="about"){
app.innerHTML=`<h2 class="section-title">เกี่ยวกับเว็บไซต์</h2>
<div class="panel"><p>เว็บไซต์นี้รวบรวมปัญหาการเชื่อมต่ออินเทอร์เน็ตบนคอมพิวเตอร์ ${P.length} ปัญหา พร้อมอาการ สาเหตุ วิธีแก้ไข และแหล่งอ้างอิง</p>
<p>ข้อมูลทางเทคนิคอ้างอิงจาก Microsoft Support, Microsoft Learn, Google Chrome Help และ Cloudflare Learning Center</p></div>`;
}

else if(state.page==="detail"){
const p=P.find(x=>x.id===state.selected);
app.innerHTML=`<button class="btn secondary back" data-action="back">← ย้อนกลับ</button>
<div class="detail"><h2>${p.icon} ${p.title}</h2><span class="tag">${catName(p.cat)}</span>
<h3>อาการที่พบ</h3><p>${p.symptoms}</p>
<h3>สาเหตุที่เป็นไปได้</h3><ul>${p.causes.map(c=>`<li>${c}</li>`).join("")}</ul>
<h3>วิธีแก้ไขทีละขั้นตอน</h3><ol>${p.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
<h3>ผลลัพธ์ที่ควรได้รับ</h3><p>${p.result}</p>
<h3>วิธีตรวจสอบเพิ่มเติม</h3><ul>${p.checks.map(c=>`<li>${c}</li>`).join("")}</ul>
<h3>แหล่งอ้างอิง</h3><div class="ref"><ul>${p.refs.map(r=>`<li><a href="${r[1]}" target="_blank" rel="noopener">${r[0]}</a></li>`).join("")}</ul></div>
<button class="btn" data-action="google" data-q="${p.title}">ค้นหาข้อมูลเพิ่มเติมจาก Google</button>
<p class="note">ผลการค้นหาจาก Google เป็นข้อมูลจากแหล่งภายนอก ไม่ใช่ข้อมูลที่จัดเก็บในเว็บไซต์นี้โดยตรง</p></div>`;
}
}

document.addEventListener("click",e=>{
const b=e.target.closest("[data-action]");
if(!b)return;
const action=b.dataset.action;
if(action==="back")goBack();
if(action==="cat")setCat(b.dataset.id);
if(action==="open")openProblem(b.dataset.id);
if(action==="google")googleSearch(b.dataset.q||"");
if(action==="search")doSearch();
});

document.querySelectorAll(".sidebar button").forEach(b=>{
b.addEventListener("click",()=>push(b.dataset.page));
});

searchBox.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});

render();
</script>
</body>
</html>
